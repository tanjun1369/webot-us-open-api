<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="712" viewBox="0 0 1180 712" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <style>
      .t  { fill:#1f2937; font-size:15px; }
      .tb { fill:#111827; font-size:16px; font-weight:600; }
      .ts { fill:#4b5563; font-size:12.5px; }
      .m  { font-family:"SF Mono",Menlo,Consolas,monospace; font-size:13.5px; fill:#1f2937; }
      .ms { font-family:"SF Mono",Menlo,Consolas,monospace; font-size:12px; fill:#1f2937; }
      .ml { font-family:"SF Mono",Menlo,Consolas,monospace; font-size:15px; fill:#1f2937; }
      .ln { stroke:#475569; stroke-width:1.8; fill:none; }
    </style>
  </defs>
  <rect width="1180" height="712" fill="#ffffff"/>

  <text x="50" y="38" class="tb" font-size="21">The Canonical String — Construction &amp; Parameter Sources</text>
  <text x="50" y="62" class="ts">The exact byte sequence you sign. Follow it literally — the signature is verified against a re-built copy of this string.</text>

  <text x="50" y="96" class="tb">Parameter sources — mixing up where each value comes from is the most common integration error</text>

  <rect x="50" y="110" width="1080" height="230" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="50" y1="140" x2="1130" y2="140" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="230" y1="110" x2="230" y2="340" stroke="#e2e8f0" stroke-width="1.2"/>
  <line x1="410" y1="110" x2="410" y2="340" stroke="#e2e8f0" stroke-width="1.2"/>
  <line x1="540" y1="110" x2="540" y2="340" stroke="#e2e8f0" stroke-width="1.2"/>
  <text x="66" y="131" class="ts" font-weight="600">Parameter</text>
  <text x="246" y="131" class="ts" font-weight="600">Source</text>
  <text x="426" y="131" class="ts" font-weight="600">In signature</text>
  <text x="556" y="131" class="ts" font-weight="600">Notes</text>

  <text x="66" y="163" class="ms">X-APIKEY</text>
  <text x="246" y="163" class="ms">X-APIKEY header</text>
  <text x="426" y="163" class="ts" fill="#b91c1c" font-weight="600">No</text>
  <text x="556" y="163" class="ts">Your API Key; used to look up your public key — a verification input, not signed content.</text>

  <text x="66" y="191" class="ms">X-Signature</text>
  <text x="246" y="191" class="ms">X-Signature header</text>
  <text x="426" y="191" class="ts" fill="#b91c1c" font-weight="600">No</text>
  <text x="556" y="191" class="ts">The signature itself, base64 (standard encoding).</text>

  <text x="66" y="219" class="ms">sub_path</text>
  <text x="246" y="219" class="ms">URL path</text>
  <text x="426" y="219" class="ts" fill="#15803d" font-weight="600">Yes</text>
  <text x="556" y="219" class="ts">The request path verbatim, not URL-decoded (e.g. /api/v2/institution/account/balances).</text>

  <text x="66" y="247" class="ms">userId</text>
  <text x="246" y="247" class="ms">query / body</text>
  <text x="426" y="247" class="ts" fill="#15803d" font-weight="600">Yes*</text>
  <text x="556" y="247" class="ts">Business param. On GET it is a query param and joins the sort; on POST it lives in the JSON body.</text>

  <text x="66" y="275" class="ms">timestamp</text>
  <text x="246" y="275" class="ms">query param</text>
  <text x="426" y="275" class="ts" fill="#15803d" font-weight="600">Yes</text>
  <text x="556" y="275" class="ts">Unix seconds. Joins the sorted query, and appears again as the last segment.</text>

  <text x="66" y="303" class="ms">other query</text>
  <text x="246" y="303" class="ms">query params</text>
  <text x="426" y="303" class="ts" fill="#15803d" font-weight="600">Yes</text>
  <text x="556" y="303" class="ts">All participate. Repeated keys → repeated k=v, sorted by value (array semantics).</text>

  <text x="66" y="331" class="ms">request_body</text>
  <text x="246" y="331" class="ms">request body</text>
  <text x="426" y="331" class="ts" fill="#15803d" font-weight="600">Yes</text>
  <text x="556" y="331" class="ts">POST: raw JSON, not parsed and not re-serialized. GET: the empty string.</text>

  <rect x="50" y="352" width="1080" height="46" rx="6" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.3"/>
  <text x="66" y="372" class="ts" font-weight="600">Why timestamp has no dedicated field:</text>
  <text x="316" y="372" class="ts">a dedicated field would create two sources. If a caller sets the field but omits timestamp from the</text>
  <text x="66" y="390" class="ts">query, the canonical string is missing it and verification fails — a hard-to-diagnose error. It is always read from the query string.</text>

  <text x="50" y="434" class="tb">Building sorted_query_string</text>
  <rect x="50" y="448" width="1080" height="80" rx="8" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.6"/>
  <text x="66" y="472" class="ts">① Percent-encode each key and value <tspan font-weight="600">separately</tspan>: do not escape A-Za-z0-9 and <tspan class="ms">- _ . ! ~ * ' ( )</tspan> (9 symbols); hex digits <tspan font-weight="600">uppercase</tspan>; space = <tspan class="ms">%20</tspan>.</text>
  <text x="66" y="496" class="ts">② Join each as <tspan class="ms">key=value</tspan>, sort the whole <tspan class="ms">key=value</tspan> strings, and join them with <tspan class="ms">&amp;</tspan>.</text>
  <text x="66" y="518" class="ts">③ Do <tspan font-weight="600">not</tspan> use form/query encoding that emits <tspan class="ms">+</tspan> for a space instead of <tspan class="ms">%20</tspan> — it does not match <tspan class="ms">encodeURIComponent</tspan> semantics.</text>

  <text x="50" y="564" class="tb">The four segments</text>

  <rect x="50" y="578" width="1080" height="50" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="66" y="609" class="ml">{sub_path}:{sorted_query_string}:{request_body}:{timestamp}</text>

  <rect x="50" y="644" width="530" height="46" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.8"/>
  <text x="66" y="663" class="ts" font-weight="600">POST (body = Y)</text>
  <text x="66" y="682" class="ms">/api/v2/institution/user/create:timestamp=9:Y:9</text>

  <rect x="600" y="644" width="530" height="46" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.8"/>
  <text x="616" y="663" class="ts" font-weight="600">GET (empty body → consecutive <tspan class="ms">::</tspan>)</text>
  <text x="616" y="682" class="ms">/api/v2/.../balances:userId=U&amp;timestamp=9::9</text>

  <path class="ln" d="M590,628 L590,644"/>
</svg>
